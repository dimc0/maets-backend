# Bases de données de Maets dans Docker (l'API, elle, se lance avec npm run dev).
# Démarrer : docker compose up -d      Arrêter : docker compose stop
#
# Utilisateur, mot de passe et nom de la base PostgreSQL sont lus dans le fichier .env.
# Ports 5433 et 27018 : ils ne gênent pas un PostgreSQL (5432) ou un MongoDB (27017)
# déjà installés sur le poste. Ce sont les valeurs par défaut de .env.example.

services:
  postgres:
    image: postgres:17-alpine
    container_name: maets-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data # les données survivent à l'arrêt du conteneur
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:8
    container_name: maets-mongo
    restart: unless-stopped
    ports:
      - '27018:27017'
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  mongodata:
